output_dir = "out"

[[jobs]]
name = "mapp_vs_isdb_lotus"
query_mgf = "fixtures/mapp_batch_00231.mgf"
library_mgf = "databases/isdb_lotus_pos_energySum.mgf"

[jobs.parse]
identifier = "FEATURE_ID"
library_identifier = "INCHIKEY"
min_peaks = 5
max_peaks = 1000

[jobs.search]
metric = "HungarianCosine"
precursor_mz_tolerance = 0.01
fragment_mz_tolerance = 0.01
mz_power = 2
intensity_power = 1.5
top_n_peaks = 150
min_matched_peaks = 6
min_similarity_threshold = 0.7
top_n = 20

[jobs.taxonomy]
query = "Withania somnifera"
lotus_csv = "data/lotus/230106_frozen_metadata.csv"
validate_with_otol = true
otol_context = "Flowering plants"

[jobs.output]
query_key = "FeatureId"
