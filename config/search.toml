output_dir = "out"

[[jobs]]
name = "mapp_batch_00249_vs_isdb_lotus"
query_mgf = "data/mapp_batch_00249.mgf"
library_mgf = "databases/isdb_lotus_pos_energySum.mgf"

[jobs.parse]
identifier = "FEATURE_ID"
library_identifier = "INCHIKEY"
min_peaks = 5
max_peaks = 1000

[jobs.search]
metric = "HungarianCosine"
precursor_mz_tolerance = 0.02
fragment_mz_tolerance = 0.02
mz_power = 2
intensity_power = 1.5
top_n_peaks = 150
min_matched_peaks = 6
min_similarity_threshold = 0.2
top_n = 20

[jobs.taxonomy]
query = "Nicotiana tabacum"
lotus_csv = "data/lotus/230106_frozen_metadata.csv"
validate_with_otol = true

[jobs.output]
query_key = "FeatureId"
