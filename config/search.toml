output_dir = "/Users/pma/git_repos/EMI/spectral-matcher/out"

[[jobs]]
name = "mapp_batch_00249_vs_isdb_lotus"
query_mgf = "/Users/pma/git_repos/mapp-metabolomics-unit/group-03/docs/mapp_project_00050/mapp_batch_00249/results/mzmine/mapp_batch_00249.mgf"
library_mgf = "/Users/pma/01_large_files/mgf/isdb_lotus_pos_energySum.mgf"

[jobs.parse]
identifier = "FEATURE_ID"
library_identifier = "INCHIKEY"
min_peaks = 5
max_peaks = 1000

[jobs.search]
metric = "HungarianCosine"
precursor_mz_tolerance = 0.02
fragment_mz_tolerance = 0.02
mz_power = 2
intensity_power = 1.5
top_n_peaks = 150
min_matched_peaks = 6
min_similarity_threshold = 0.2
top_n = 20

[jobs.taxonomy]
query = "Nicotiana tabacum"
lotus_csv = "/Users/pma/01_large_files/lotus/230106_frozen_metadata.csv"
validate_with_otol = true

[jobs.output]
query_key = "FeatureId"
